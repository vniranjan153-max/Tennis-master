<style>
  :root {
    --ink: #f4f7ff;
    --ink-soft: rgba(244, 247, 255, .72);
    --glass: rgba(255, 255, 255, .10);
    --glass-edge: rgba(255, 255, 255, .28);
    --bg: #04120a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: grid;
    place-items: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Colour blobs behind the glass: the glass needs something to blur */
  .orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .85; z-index: -1; animation: drift 18s ease-in-out infinite alternate; }
  .orb.a { width: 46vmax; height: 46vmax; background: #7dff1a; top: -14vmax; left: -10vmax; }
  .orb.b { width: 40vmax; height: 40vmax; background: #0e9f3e; bottom: -14vmax; right: -8vmax; animation-delay: -6s; }
  .orb.c { width: 28vmax; height: 28vmax; background: #ffc83d; top: 38%; left: 52%; animation-delay: -11s; }
  @keyframes drift { to { transform: translate(5vmax, 4vmax) scale(1.12); } }

  .card {
    width: min(560px, 100%);
    padding: clamp(28px, 6vw, 52px);
    text-align: center;
    background: linear-gradient(145deg, rgba(255,255,255,.18), var(--glass));
    border: 1px solid var(--glass-edge);
    border-radius: 32px;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 30px 80px rgba(0, 10, 4, .55), inset 0 1px 0 rgba(255,255,255,.4);
  }

  .logo { width: clamp(150px, 38vw, 210px); margin: 0 auto 18px; filter: drop-shadow(0 12px 28px rgba(125,255,26,.35)); }
  .logo img { display: block; width: 100%; height: auto; }

  h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .tagline { margin: 12px auto 0; max-width: 34ch; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.5; }

  .count {
    margin: 34px 0 6px;
    font-size: clamp(3.6rem, 16vw, 6rem);
    font-weight: 800;
    letter-spacing: -.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .count-label { color: var(--ink-soft); font-size: 1rem; }

  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 34px; padding: 16px 30px;
    font: inherit; font-weight: 800; font-size: 1.05rem;
    color: #052e12; text-decoration: none;
    background: linear-gradient(135deg, #b6ff3d, #5ee02a);
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(125,255,26,.4), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .2s, box-shadow .2s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(125,255,26,.6), inset 0 1px 0 rgba(255,255,255,.6); }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .cta svg { width: 20px; height: 20px; fill: #052e12; }

  footer { margin-top: 28px; font-size: .85rem; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
    .cta { transition: none; }
  }
  /* Fallback for browsers without backdrop-filter */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card { background: rgba(8, 40, 20, .88); }
  }
</style>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  // Count up to 1,000,000 once on load. Ends on "1M+".
  (function () {
    var el = document.getElementById("count");
    var target = 1000000, duration = 1800;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var start = null;
    function step(t) {
      if (!start) start = t;
      var p = Math.min((t - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      var n = Math.floor(target * eased);
      el.textContent = p < 1 ? n.toLocaleString("en-US") : "1M+";
      if (p < 1) requestAnimationFrame(step);
    }
    el.textContent = "0";
    requestAnimationFrame(step);
  })();
</script>
